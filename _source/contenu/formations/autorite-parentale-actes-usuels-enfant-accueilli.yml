slug: autorite-parentale-actes-usuels-enfant-accueilli
ordre: 8
theme: Protection de l’enfance
titre: 'Autorité parentale et actes usuels : qui décide quoi pour l’enfant accueilli ?'
titre_court: Autorité parentale et actes usuels
nouveau: true
jours: 2
heures: 12
intro: 'Une coupe de cheveux, une sortie scolaire, un vaccin, un passeport, une photo sur un réseau social : au quotidien, les équipes doivent savoir ce qu’elles peuvent faire seules et ce qui demande l’accord des parents, du service gardien ou du juge. Cette formation, animée par deux éducateurs spécialisés en poste en protection de l’enfance, clarifie ces repères juridiques et les relie à la pratique, en intégrant l’actualité législative de la protection de l’enfance.'
public: 'Équipes éducatives, chefs de service, secrétariats, assistants familiaux et cadres des MECS, foyers, lieux de vie et services de placement familial.'
prerequis: Aucun.
objectifs:
- Expliquer les principes de l’autorité parentale et ce qui change, ou non, quand l’enfant est confié
- Distinguer acte usuel et acte non usuel à partir des critères de la jurisprudence et des guides nationaux
- Identifier, pour un acte donné, qui décide, qui informer et quelles démarches engager en cas de désaccord
- Associer l’enfant aux décisions qui le concernent, selon son âge et sa maturité
- Tracer les décisions et intégrer les évolutions législatives récentes dans les pratiques du service
programme:
- titre: L’autorité parentale quand l’enfant est confié
  points:
  - 'Principes : l’autorité parentale, ses finalités et l’association de l’enfant aux décisions (Code civil, art. 371-1)'
  - Ce que les parents conservent quand l’enfant est confié (Code civil, art. 373-4 et 375-7)
  - 'Mesures administratives et judiciaires, délégation, délaissement : repères (Code civil, art. 375-3 et 377)'
  - Rôle du service gardien et de l’établissement
- titre: Actes usuels et non usuels
  points:
  - Critères de distinction ; actes que l’établissement accomplit seul (Code civil, art. 373-4)
  - Liste des actes usuels annexée au projet pour l’enfant (CASF, art. L. 223-1-2)
  - Autorisation du juge en cas de refus abusif ou injustifié ou de négligence (Code civil, art. 375-7)
  - Santé, scolarité, loisirs, image, religion, voyages
- titre: Quand il y a désaccord ou urgence
  points:
  - Parents injoignables ou opposés, urgence médicale, désaccord entre parents
  - Circuit de décision et écrits
  - Avis de l’enfant (CASF, art. L. 223-4) et communication avec les familles
- titre: Actualité législative et mise en pratique
  points:
  - 'Projet de loi relatif à la protection des enfants et autres textes : point mis à jour à la date de chaque session'
  - Effets sur les pratiques et les documents du service
  - Traçabilité des décisions et plan d’action du service
horaires:
- 9h00 – 12h00
- 13h00 – 16h00
pedagogie:
- Supports pédagogiques imprimés et/ou numériques
- Apports juridiques courts et illustrés, repères vérifiés sur Légifrance à la date de chaque session
- Quiz, études de situations fictives et travail en sous-groupes
- 'Outils remis : tableau de repères actes usuels et non usuels, logigramme « qui décide ? », modèles de courrier'
- Partage d’expériences
evaluation:
- Questionnaire de positionnement en amont
- Évaluations individuelles à chaud et à froid
- Tour de table en fin de formation
- Analyse des questionnaires
- Vérification de l’atteinte des objectifs par l’étude de trois situations fictives et un questionnaire de connaissances
effectif: Jusqu’à 12 personnes
