slug: ecrits-professionnels-dans-le-secteur-social-et-medico-social
ordre: 9
theme: Posture et pratiques
titre: Les écrits professionnels dans le secteur social et médico-social
jours: 3
heures: 18
intro: 'Cette formation aide à mieux répondre aux exigences des différents écrits professionnels du secteur social. Écrire engage : cela demande de s’interroger sur son propre rapport à l’écrit et sur les normes et lois en vigueur. Les enjeux concernent tous les acteurs : personne accompagnée, auteur, équipe, hiérarchie, institutions.'
public: Tout professionnel amené à rédiger des écrits professionnels dans le secteur social et médico-social.
prerequis: Savoir parler, lire et écrire le français. Être concerné par la transmission d’informations écrites dans le secteur social ou médico-social.
objectifs:
- Rédiger avec clarté, précision et correction, de façon structurée, synthétique et concise
- Intégrer les contraintes propres aux différents types de documents professionnels
- 'Maîtriser les spécificités de l’écrit professionnel : cadre légal, éthique, place de la subjectivité'
programme:
- titre: Cadre législatif et éthique
  points:
  - Situer la place des écrits dans les circuits d’information et les pratiques de l’institution
  - Réfléchir au positionnement de chacun (personnes accompagnées, familles, intervenants, partenaires) grâce à une meilleure connaissance des obligations respectives
  - 'Identifier le cadre législatif actuel : lois du 2 janvier 2002 et du 4 mars 2002, décret du 17 novembre 2016 sur le rapport de situation, décret du 28 septembre 2016 sur le contenu du PPE'
  - Décrire le secret partagé et la confidentialité dans le travail social, et les dérogations possibles
- titre: Les différents types d’écrits
  points:
  - 'Prendre en compte les besoins des destinataires : quelle demande, pour qui, pour quoi, quel type d’écrit ?'
  - 'Prendre en compte les différentes finalités : informative, descriptive, analytique'
  - 'Citer les différents écrits du quotidien professionnel : compte rendu, note de service, lettre, rapport, courrier électronique'
  - Connaître les attentes spécifiques du juge des enfants et l’importance de l’anamnèse dans les rapports transmis à l’ASE et au juge
- titre: 'Enjeux de l’écrit : prise de position et subjectivité'
  points:
  - Dépasser les difficultés propres au fait d’écrire au sujet d’autrui
  - Adopter une posture objective à partir de la subjectivité de chacun
titre_court: Les écrits professionnels dans le secteur social et médico-social
nouveau: false
horaires:
- 9h00 – 12h00
- 13h00 – 16h00
pedagogie:
- Supports pédagogiques imprimés et/ou numériques
- Apports conceptuels
- Mises en pratique autour de cas concrets
- Partage d’expériences
evaluation:
- Évaluations individuelles à chaud et à froid
- Tour de table en fin de formation
- Retour du formateur
- Analyse des questionnaires
- Vérification de l’atteinte des objectifs par des exercices de mise en pratique
effectif: 10 à 15 personnes
# Encadré « L'essentiel à savoir » (validé par Alexandre le 31/10/2026), avec balisage FAQPage.
# Articles vérifiés sur Légifrance le 31/10/2026.
essentiel:
  titre: 'Écrits professionnels en travail social : l’essentiel à savoir'
  questions:
  - q: La personne accompagnée peut-elle lire ce qui est écrit sur elle ?
    r: Oui, en principe. Toute personne accueillie ou accompagnée par un établissement ou service social ou médico-social a droit à la confidentialité des informations qui la concernent et à l’accès à toute information ou document relatif à sa prise en charge, sauf dispositions législatives contraires (article L311-3 du Code de l’action sociale et des familles). Un écrit professionnel se rédige donc en sachant que la personne pourra le lire.
  - q: Que doit contenir le rapport de situation en protection de l’enfance ?
    r: Le service établit ce rapport au moins une fois par an, ou tous les six mois pour les enfants de moins de trois ans, après une évaluation pluridisciplinaire. Il porte sur la santé physique et psychique de l’enfant, son développement, sa scolarité, sa vie sociale et ses relations avec sa famille et les tiers. Son contenu et ses conclusions sont portés au préalable à la connaissance des parents et de l’enfant, selon son âge et sa maturité (article L223-5 du Code de l’action sociale et des familles).
  - q: Quel lien entre ces écrits et le projet pour l’enfant ?
    r: Le projet pour l’enfant est un document unique qui accompagne le mineur tout au long de son parcours en protection de l’enfance. Il est remis au mineur et à ses représentants légaux, transmis au juge lorsqu’il est saisi, et mis à jour sur la base des rapports de situation (article L223-1-1 du Code de l’action sociale et des familles).
  - q: Les familles peuvent-elles consulter les écrits transmis au juge des enfants ?
    r: Oui. En assistance éducative, le dossier peut être consulté au greffe par les avocats et, sur leur demande, par les parents, le tuteur et le mineur capable de discernement, jusqu’à la veille de l’audience. En l’absence d’avocat, le juge peut, par décision motivée, écarter tout ou partie des pièces si leur consultation ferait courir un danger physique ou moral grave au mineur, à une partie ou à un tiers (article 1187 du Code de procédure civile).
  - q: Peut-on tout écrire dans un dossier ?
    r: Non. Le secret professionnel s’applique aussi à l’écrit (article 226-13 du Code pénal), et les informations échangées entre professionnels doivent être strictement nécessaires à l’accompagnement de la personne (article L1110-4 du Code de la santé publique).
  conclusion: Entre ce que la loi exige et ce qu’il est juste d’écrire au sujet d’une personne, chaque écrit engage son auteur. C’est ce que cette formation permet de travailler avec votre équipe, à partir de vos propres documents.
