# Encadré « L'essentiel à savoir » (validé par Alexandre le 30/10/2026), avec balisage FAQPage.
# Articles vérifiés sur Légifrance le 30/10/2026. L'article 226-14 du Code pénal change en 2029 : revoir la dernière réponse à ce moment-là.
essentiel:
  titre: 'Secret professionnel et secret partagé : l’essentiel à savoir'
  questions:
  - q: Qui est tenu au secret professionnel ?
    r: Le Code pénal vise toute personne qui détient une information à caractère secret « par état ou par profession », ou « en raison d’une fonction ou d’une mission temporaire » (article 226-13 du Code pénal). Certains y sont soumis par leur profession, comme les assistants de service social (article L411-3 du Code de l’action sociale et des familles). D’autres le sont par leur mission, comme toute personne qui participe aux missions de l’aide sociale à l’enfance (article L221-6 du même code). Dans un établissement ou service social ou médico-social, toute personne accompagnée a droit au secret des informations qui la concernent (article L1110-4 du Code de la santé publique).
  - q: Que risque-t-on en cas de révélation ?
    r: Un an d’emprisonnement et 15 000 € d’amende (article 226-13 du Code pénal).
  - q: Peut-on partager des informations au sein de l’équipe ?
    r: Oui, dans un cadre précis. Les professionnels d’un même établissement ou service qui participent à l’accompagnement d’une personne forment une « équipe de soins » au sens de la loi (article L1110-12 du Code de la santé publique). Ils peuvent partager les informations strictement nécessaires à la coordination, à la continuité ou au suivi médico-social et social de cette personne. En dehors de cette équipe, le partage d’informations nécessaires à sa prise en charge suppose son consentement préalable. Dans tous les cas, la personne est informée qu’elle peut s’opposer au partage (article L1110-4 du Code de la santé publique).
  - q: Et en protection de l’enfance ?
    r: Les professionnels soumis au secret qui participent à la protection de l’enfance peuvent partager des informations à caractère secret pour évaluer une situation et décider des actions de protection et d’aide. Ce partage est « strictement limité à ce qui est nécessaire ». Les parents et l’enfant, selon son âge et sa maturité, en sont informés au préalable, sauf si c’est contraire à l’intérêt de l’enfant (article L226-2-2 du Code de l’action sociale et des familles).
  - q: Quand le secret ne s’applique-t-il pas ?
    r: Dans les cas où la loi impose ou autorise la révélation. C’est notamment le cas pour informer les autorités judiciaires, médicales ou administratives de maltraitances infligées à un mineur ou à une personne qui n’est pas en mesure de se protéger. Un signalement fait de bonne foi n’engage pas la responsabilité de son auteur (article 226-14 du Code pénal).
  conclusion: Sur le terrain, la frontière entre ce qui doit être dit, ce qui peut l’être et ce qui doit rester confidentiel est rarement aussi nette. C’est précisément ce que cette formation permet de travailler avec votre équipe, à partir de vos situations.
