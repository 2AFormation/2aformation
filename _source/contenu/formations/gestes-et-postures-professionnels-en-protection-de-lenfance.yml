slug: gestes-et-postures-professionnels-en-protection-de-lenfance
publie: false
ordre: 17
theme: Protection de l’enfance
nouveau: true
titre: Gestes et postures professionnels en protection de l’enfance
jours: 3
heures: 18
intro: Cette formation aborde les gestes et postures professionnels dans le domaine de la protection de l’enfance.
public: L’ensemble des professionnels exerçant en protection de l’enfance.
prerequis: Aucun.
objectifs:
- Identifier les enjeux de la relation éducative
- Questionner ses représentations de la violence et l’appréhender dans un contexte professionnel
- Accompagner avec une posture professionnelle éthique et déontologique
- Comprendre la dynamique des groupes restreints et son impact sur la pratique
programme:
- titre: Les enjeux de la relation éducative
  points:
  - Définir la relation éducative
  - Comprendre les besoins de l’enfant selon son évolution
  - Élaborer une posture en adéquation avec les besoins de l’enfant et le cadre institutionnel
  - Évaluer l’implication du professionnel dans la relation éducative
- titre: Représentations et violence
  points:
  - 'Définir la violence : dans la relation et violence institutionnelle'
  - Comprendre le cadre législatif
  - 'Faire face à la violence : adapter sa posture et définir un cadre éducatif sécurisant'
- titre: Une posture éthique et déontologique
  points:
  - Savoir adapter sa posture professionnelle
  - Définir l’éthique et la déontologie
- titre: La dynamique des groupes restreints
  points:
  - Comprendre les enjeux au sein de l’équipe et du groupe de jeunes
  - Appréhender le groupe autrement
  - Questionner son propre rôle dans la dynamique observée
titre_court: Gestes et postures professionnels en protection de l’enfance
horaires:
- 9h00 – 12h00
- 13h00 – 16h00
pedagogie:
- Supports pédagogiques imprimés et/ou numériques
- Apports conceptuels
- Mises en pratique autour de cas concrets
- Partage d’expériences
evaluation:
- Évaluations individuelles à chaud et à froid
- Tour de table en fin de formation
- Retour du formateur
- Analyse des questionnaires
- Vérification de l’atteinte des objectifs par des exercices de mise en pratique
effectif: 10 à 15 personnes
