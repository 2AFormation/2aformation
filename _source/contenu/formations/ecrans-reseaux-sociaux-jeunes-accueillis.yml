slug: ecrans-reseaux-sociaux-jeunes-accueillis
ordre: 7
theme: Protection de l’enfance
titre: 'Écrans, réseaux sociaux et jeunes accueillis : protéger sans couper le lien'
titre_court: Écrans, réseaux sociaux et jeunes accueillis
nouveau: true
jours: 2
heures: 12
intro: 'Le téléphone est souvent l’objet de tous les conflits dans les lieux d’accueil. Il est aussi un lien avec la famille et les amis, un espace d’identité… et parfois une porte d’entrée pour le harcèlement, l’exploitation ou les fugues. Cette formation, animée par deux éducateurs spécialisés en poste en protection de l’enfance, aide les équipes à comprendre les usages numériques des jeunes, à repérer les risques et à construire un cadre éducatif cohérent plutôt qu’une suite d’interdits.'
public: 'Équipes éducatives, surveillants de nuit, chefs de service et assistants familiaux des MECS, foyers, lieux de vie et services de placement ; professionnels de prévention spécialisée.'
prerequis: Aucun. Aucune compétence technique particulière n’est attendue.
objectifs:
- Décrire les usages numériques des adolescents et la place des images dans la construction de soi
- 'Repérer les risques en ligne : cyberharcèlement, diffusion d’images, sollicitations sexuelles, recrutement'
- 'Réagir face à une situation à risque : protéger, conserver les preuves, signaler, orienter'
- Construire avec l’équipe et les jeunes des règles d’usage cohérentes, expliquées et évolutives
- Utiliser le numérique comme support éducatif et de prévention
programme:
- titre: Les jeunes, les écrans et les images
  points:
  - 'Usages réels des adolescents : réseaux, messageries, jeux, vidéos'
  - Image de soi, regard des pairs, prise de risque et construction identitaire
  - 'Particularités des jeunes accueillis : lien familial, solitude, besoin d’appartenance'
- titre: Repérer les risques en ligne
  points:
  - Cyberharcèlement, diffusion d’images intimes, sollicitations sexuelles de mineurs
  - Exploitation, recrutement et fugues organisées en ligne ; liens avec le risque prostitutionnel
  - 'Signaux d’alerte et repères pénaux (Code pénal, art. 222-33-2-2, 226-2-1 et 227-22-1)'
- titre: Réagir et signaler
  points:
  - Protéger le jeune, conserver les preuves sans les diffuser
  - 'Signaler : hiérarchie, autorités, plateforme PHAROS, numéro 3018'
  - Parler avec le jeune sans le culpabiliser ; informer les parents et le service gardien
- titre: Construire un cadre éducatif partagé
  points:
  - 'Règles d’usage : lesquelles, pourquoi, avec qui'
  - 'Nuit, chambres, téléphones confisqués : questions de droit et de pratique'
  - Associer les jeunes ; le numérique comme outil éducatif et de prévention
horaires:
- 9h00 – 12h00
- 13h00 – 16h00
pedagogie:
- Supports pédagogiques imprimés et/ou numériques
- Apports courts et exploration guidée des applications utilisées par les jeunes
- Études de parcours fictifs, travail en sous-groupes et jeux de rôle (chacun peut choisir d’observer)
- Partage d’expériences ; aucune image ni situation réelle n’est utilisée
evaluation:
- Questionnaire de positionnement en amont
- Évaluations individuelles à chaud et à froid
- Tour de table en fin de formation
- Analyse des questionnaires
- Vérification de l’atteinte des objectifs par l’étude d’une situation fictive et un questionnaire de connaissances
effectif: Jusqu’à 12 personnes
