slug: desamorcer-agressivite-situation-accueil
ordre: 17
theme: Posture et pratiques
titre: 'Désamorcer l’agressivité en situation d’accueil : prévenir, faire face, se relever'
titre_court: Désamorcer l’agressivité à l’accueil
nouveau: true
jours: 2
heures: 12
intro: 'Une attente qui s’allonge, un refus, une incompréhension : à l’accueil, la tension monte parfois en quelques secondes. Cette formation s’appuie sur l’expérience d’éducateurs qui gèrent des crises au quotidien. Elle aide à comprendre ce qui se joue, à repérer les signaux, à faire baisser la tension par la parole, à se protéger et à reprendre pied après un incident, seul et en équipe.'
public: 'Tout professionnel en contact avec le public : agents d’accueil et de guichet, secrétariats, gardiens et agents de proximité, conseillers, personnels d’accueil des établissements de santé, sociaux et médico-sociaux.'
prerequis: Aucun. Être en contact, même occasionnel, avec un public.
objectifs:
- Distinguer incivilité, agressivité et violence, et expliquer les mécanismes de l’escalade
- Repérer les situations à risque et les signaux d’alerte, et proposer des aménagements de l’accueil
- Utiliser des techniques verbales et non verbales pour faire baisser la tension et poser une limite
- 'Se protéger et protéger ses collègues : interrompre l’échange, alerter et se mettre en sécurité'
- 'Agir après un incident : rendre compte par écrit, connaître ses droits et soutenir un collègue'
programme:
- titre: Comprendre l’agressivité et ses mécanismes
  points:
  - 'Incivilité, agressivité, violence : de quoi parle-t-on ?'
  - Le cycle de la crise, du déclencheur au retour au calme
  - 'Nos propres réactions face à la menace : combattre, fuir, se figer'
- titre: Prévenir et repérer les signaux
  points:
  - 'Organisation de l’attente, information, aménagement de l’espace et distances'
  - Signaux d’alerte verbaux, non verbaux et dans la voix
  - 'Travail en équipe : binôme, code d’alerte, relais'
- titre: Désamorcer par la parole et poser une limite
  points:
  - Écoute active, reformulation et reconnaissance de l’émotion
  - Dire non et expliquer un refus (méthode DESC), proposer une issue
  - Passer le relais et interrompre l’échange pour se mettre en sécurité
- titre: 'Après l’incident : se protéger, rendre compte, se relever'
  points:
  - Alerter, mettre en sécurité et rédiger un compte rendu factuel
  - 'Repères juridiques : obligation de sécurité, droit de retrait, plainte, accident du travail, protection fonctionnelle'
  - Soutenir un collègue et organiser un retour d’expérience en équipe
horaires:
- 9h00 – 12h00
- 13h00 – 16h00
pedagogie:
- Supports pédagogiques imprimés et/ou numériques
- Apports conceptuels et scènes jouées par les formateurs
- Jeux de rôle progressifs (situations fictives, droit de ne pas jouer)
- Partage d’expériences
evaluation:
- Évaluations individuelles à chaud et à froid
- Tour de table en fin de formation
- Retour du formateur
- Analyse des questionnaires
- Vérification de l’atteinte des objectifs par une simulation finale évaluée
effectif: 8 à 12 personnes
