slug: de-la-crise-a-la-contention-psychique
ordre: 13
theme: Violences et situations de danger
nouveau: true
titre: 'De la crise à la contention psychique : repères éthiques et pratiques professionnelles'
titre_court: De la crise à la contention psychique
jours: 3
heures: 18
intro: 'Crise, passage à l’acte, violence envers les autres ou envers soi-même : ces moments mettent à l’épreuve les professionnels comme l’institution. Cette formation donne des repères pour comprendre la crise, y répondre de façon contenante et éthique, et construire en équipe des outils de prévention et de reprise. Elle s’adresse aux professionnels du social et du médico-social, notamment en protection de l’enfance.'
public: L’ensemble des professionnels exerçant dans le social et le médico-social.
prerequis: Aucun.
objectifs:
- Définir la violence et la crise, et comprendre leurs mécanismes et leurs déclencheurs
- Distinguer contention physique et contention psychique, et situer leurs repères éthiques et légaux
- 'Adopter une posture contenante face à la crise : cohérence d’équipe, cadre sécurisant, communication non violente'
- Analyser le lien entre fonctionnement institutionnel et violence des jeunes ou des résidents
- Construire en équipe des outils de prévention, de gestion et de reprise après la crise
programme:
- titre: Comprendre la violence et la crise
  points:
  - 'Définir la violence : dans la relation, entre pairs, violence institutionnelle'
  - Les étapes de la crise et ses déclencheurs
  - Comprendre sa grille de lecture face à la violence
- titre: Contention physique et contention psychique
  points:
  - Définir et distinguer contention physique et contention psychique
  - Le cadre législatif et ses limites, repères éthiques et déontologiques
  - La cohérence de l’équipe comme contenant psychique
- titre: Faire face à la crise
  points:
  - Repérer les signes avant-coureurs et désamorcer
  - 'Adapter sa posture pendant la crise : protéger, contenir, passer le relais'
  - Introduction à la communication non violente
- titre: L’institution et le groupe face à la violence
  points:
  - Le lien entre fonctionnement institutionnel et violence des jeunes ou des résidents
  - La dynamique du groupe et la place de chacun
  - 'Après la crise : reprise avec la personne, temps d’équipe, outils partagés'
horaires:
- 9h00 – 12h00
- 13h00 – 16h00
pedagogie:
- Supports pédagogiques imprimés et/ou numériques
- Apports conceptuels
- Mises en pratique autour de cas concrets
- Partage d’expériences
evaluation:
- Évaluations individuelles à chaud et à froid
- Tour de table en fin de formation
- Retour du formateur
- Analyse des questionnaires
- Vérification de l’atteinte des objectifs par des exercices de mise en pratique
effectif: 10 à 15 personnes
# Encadré « L'essentiel à savoir » (validé par Alexandre le 31/10/2026), avec balisage FAQPage.
# Articles vérifiés sur Légifrance le 31/10/2026.
essentiel:
  titre: 'Crise, violence et contention en établissement : l’essentiel à savoir'
  questions:
  - q: Contention physique, contention psychique, quelle différence ?
    r: La contention physique consiste à limiter les mouvements d’une personne par la force ou par un moyen matériel. La contention psychique désigne la capacité d’un professionnel et d’une équipe à accueillir ce qui déborde une personne en crise, à mettre des mots et à offrir un cadre sécurisant, sans recourir à la force. C’est sur cette seconde dimension que repose l’essentiel de la prévention.
  - q: Le cadre légal de la contention en psychiatrie s’applique-t-il en établissement social ou médico-social ?
    r: Non. Le Code de la santé publique encadre l’isolement et la contention comme des pratiques de dernier recours, réservées aux patients en hospitalisation complète sans consentement en psychiatrie, sur décision motivée d’un psychiatre (article L3222-5-1 du Code de la santé publique). Ce cadre ne concerne pas les établissements et services sociaux et médico-sociaux.
  - q: Peut-on intervenir physiquement face à une personne en crise ?
    r: Uniquement face à un danger actuel ou imminent pour la personne ou pour autrui, et à condition que le geste soit nécessaire et proportionné à la menace. Ce sont les conditions de la légitime défense et de l’état de nécessité (articles 122-5 et 122-7 du Code pénal). Elles sont appréciées au cas par cas, après coup, et ne valent jamais autorisation de principe.
  - q: Quels droits de la personne accompagnée faut-il garder en tête ?
    r: Toute personne accueillie ou accompagnée par un établissement ou service social ou médico-social a droit au respect de sa dignité, de son intégrité, de sa vie privée, de son intimité, de sa sécurité et de son droit à aller et venir librement (article L311-3 du Code de l’action sociale et des familles).
  - q: Que faire après un incident grave ?
    r: Reprendre avec la personne et en équipe. L’établissement doit aussi informer sans délai les autorités qui l’ont autorisé de tout événement qui menace ou compromet la santé, la sécurité ou le bien-être des personnes accompagnées (article L331-8-1 du Code de l’action sociale et des familles). Une réponse inadaptée, même non intentionnelle et d’origine institutionnelle, peut relever de la maltraitance au sens de la loi (article L119-1 du même code).
  conclusion: 'Prévenir la crise, y répondre sans violence, protéger quand il le faut et reprendre ensuite : c’est ce que cette formation permet de travailler avec votre équipe, à partir de vos situations.'
