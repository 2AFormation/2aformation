slug: de-la-crise-a-la-contention-psychique
ordre: 13
theme: Violences et situations de danger
nouveau: true
titre: 'De la crise à la contention psychique : repères éthiques et pratiques professionnelles'
titre_court: De la crise à la contention psychique
jours: 3
heures: 18
intro: 'Crise, passage à l’acte, violence envers les autres ou envers soi-même : ces moments mettent à l’épreuve les professionnels comme l’institution. Cette formation donne des repères pour comprendre la crise, y répondre de façon contenante et éthique, et construire en équipe des outils de prévention et de reprise. Elle s’adresse aux professionnels du social et du médico-social, notamment en protection de l’enfance.'
public: L’ensemble des professionnels exerçant dans le social et le médico-social.
prerequis: Aucun.
objectifs:
- Définir la violence et la crise, et comprendre leurs mécanismes et leurs déclencheurs
- Distinguer contention physique et contention psychique, et situer leurs repères éthiques et légaux
- 'Adopter une posture contenante face à la crise : cohérence d’équipe, cadre sécurisant, communication non violente'
- Analyser le lien entre fonctionnement institutionnel et violence des jeunes ou des résidents
- Construire en équipe des outils de prévention, de gestion et de reprise après la crise
programme:
- titre: Comprendre la violence et la crise
  points:
  - 'Définir la violence : dans la relation, entre pairs, violence institutionnelle'
  - Les étapes de la crise et ses déclencheurs
  - Comprendre sa grille de lecture face à la violence
- titre: Contention physique et contention psychique
  points:
  - Définir et distinguer contention physique et contention psychique
  - Le cadre législatif et ses limites, repères éthiques et déontologiques
  - La cohérence de l’équipe comme contenant psychique
- titre: Faire face à la crise
  points:
  - Repérer les signes avant-coureurs et désamorcer
  - 'Adapter sa posture pendant la crise : protéger, contenir, passer le relais'
  - Introduction à la communication non violente
- titre: L’institution et le groupe face à la violence
  points:
  - Le lien entre fonctionnement institutionnel et violence des jeunes ou des résidents
  - La dynamique du groupe et la place de chacun
  - 'Après la crise : reprise avec la personne, temps d’équipe, outils partagés'
horaires:
- 9h00 – 12h00
- 13h00 – 16h00
pedagogie:
- Supports pédagogiques imprimés et/ou numériques
- Apports conceptuels
- Mises en pratique autour de cas concrets
- Partage d’expériences
evaluation:
- Évaluations individuelles à chaud et à froid
- Tour de table en fin de formation
- Retour du formateur
- Analyse des questionnaires
- Vérification de l’atteinte des objectifs par des exercices de mise en pratique
effectif: 10 à 15 personnes
