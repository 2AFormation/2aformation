# Pages « Trouver son stage de … » par formation (trouver-son-stage/formation/<slug>/).
# Règles de formation pratique vérifiées le 09/10/2026 sur Légifrance (arrêtés du 6 octobre 2025)
# et sur les textes antérieurs (arrêté ME du 20 juin 2007, fiches DREETS Auvergne-Rhône-Alpes 2024).
# 15/10/2026 : ME mis à jour (arrêté du 5 juillet 2024, en vigueur au 1er septembre 2024) et DEAES ajouté (arrêté du 30 août 2021), vérifiés sur Légifrance . 15/10/2026 : ES, ASS, EJE, ETS et CESF revérifiés sur Légifrance (règles exactes, précisions sur les référents).
# « types » : libellés exacts de l'annuaire (champ t), pour le lien « autour de chez moi ».
verification: 15/10/2026
formations:
- slug: educateur-specialise
  sigle: DEES
  titre: éducateur spécialisé
  de: "d'éducateur spécialisé"
  intro: "L'éducateur spécialisé accompagne des enfants, des adolescents ou des adultes en difficulté, au quotidien et dans la durée. Les stages sont le cœur de la formation : ils comptent autant que les cours pour valider les compétences."
  nouveau: "Pour les étudiants entrés en formation à partir de septembre 2026 : 55 semaines de formation pratique (1 925 heures) sur trois ans. Une première période de 9 à 13 semaines pendant la première année, sur deux à trois sites, pour découvrir les champs du métier ; puis 42 à 46 semaines sur deux ou trois sites."
  referent: "La première période est encadrée par un référent qui a au moins un diplôme de même niveau. Ensuite, au moins les deux tiers des stages doivent être encadrés par un référent titulaire du diplôme d'État d'éducateur spécialisé. Posez la question dès l'appel : y aura-t-il un éducateur spécialisé diplômé pour vous suivre ?"
  ancien: "Entrés avant septembre 2026 : 2 100 heures de stage (60 semaines) sur trois ans, auprès d'un référent professionnel éducateur spécialisé."
  source_nouveau: ["Arrêté du 6 octobre 2025 relatif au DEES (Légifrance)", "https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000052384644"]
  source_ancien: ["Fiche DEES, DREETS Auvergne-Rhône-Alpes (2024)", "https://auvergne-rhone-alpes.dreets.gouv.fr/sites/auvergne-rhone-alpes.dreets.gouv.fr/IMG/pdf/es_2024.pdf"]
  types: [MECS, "Foyer de l'enfance", AEMO / AED, Prévention spécialisée, Lieu de vie et d'accueil, Centre parental, IME, ITEP / DITEP, SESSAD, "Milieu ouvert (PJJ)", "Placement (PJJ)", CHRS, Foyer de vie, SAVS, CSAPA (addictologie), Centre social]
  conseils:
  - "Variez les publics : un stage en protection de l'enfance, un autre en handicap ou en insertion. Les jurys et les employeurs apprécient un parcours qui montre votre capacité d'adaptation."
  - "Le stage long est souvent celui qui ouvre la porte du premier poste : choisissez-le dans un secteur où vous vous voyez travailler."
  - "Préparez-vous aux horaires d'internat (soirées, week-ends) dans les MECS et les foyers : c'est là que se joue une grande partie du travail éducatif."
- slug: moniteur-educateur
  sigle: DEME
  titre: moniteur-éducateur
  de: "de moniteur-éducateur"
  intro: "Le moniteur-éducateur partage le quotidien des personnes accompagnées : lever, repas, activités, coucher. La formation dure deux ans et les stages y tiennent une place centrale."
  nouveau: "Pour les étudiants entrés en formation à partir de septembre 2024 : 1 050 heures de formation pratique (30 semaines à 35 heures), sur au moins deux sites distincts. Une période doit obligatoirement se dérouler dans une structure qui accueille du public en hébergement. Les heures se répartissent entre les trois blocs de compétences : 455 heures (accompagnement socio-éducatif), 420 heures (projet éducatif spécialisé) et 175 heures (travail d'équipe et partenarial)."
  referent: "Chaque période est encadrée par un référent titulaire du diplôme de moniteur-éducateur ou, à défaut, par un professionnel en fonction d'encadrement dans l'action sociale ou médico-sociale. Si vous êtes déjà en poste de moniteur-éducateur, vous pouvez faire la formation pratique chez votre employeur, mais dans un autre service ou auprès d'un autre public ; une partie peut se faire sur votre poste."
  ancien: "Entrés avant septembre 2024 (arrêté du 20 juin 2007, aujourd'hui abrogé) : 28 semaines de formation pratique (980 heures), en deux ou trois stages d'au moins 8 semaines."
  source_nouveau: ["Arrêté du 5 juillet 2024 relatif au DEME (Légifrance)", "https://www.legifrance.gouv.fr/loda/id/JORFTEXT000049889174"]
  source_ancien: ["Arrêté du 20 juin 2007 relatif au DEME (Bulletin officiel)", "https://www.education.gouv.fr/bo/2007/31/MTSA0755914A.htm"]
  types: [MECS, "Foyer de l'enfance", Lieu de vie et d'accueil, IME, ITEP / DITEP, Foyer de vie, "Foyer d'hébergement", Foyer non médicalisé, FAM, Accueil médicalisé, MAS, CHRS, "Placement (PJJ)"]
  conseils:
  - "Gardez en tête l'obligation d'un stage avec hébergement : MECS, foyer de vie, foyer d'hébergement, FAM, MAS, CHRS… Cherchez-le en priorité."
  - "Le support d'activité (sport, cuisine, atelier, jeu) est votre force : mentionnez-le dans votre lettre et à l'entretien."
  - "Les foyers de vie et les foyers d'hébergement pour adultes reçoivent souvent moins de demandes que les structures pour enfants."
- slug: assistant-de-service-social
  sigle: DEASS
  titre: assistant de service social
  de: "d'assistant de service social"
  intro: "L'assistant de service social accompagne les personnes et les familles dans l'accès à leurs droits, la protection et l'insertion. Ses stages se font souvent dans des services publics, absents de notre annuaire : pensez-y."
  nouveau: "Pour les étudiants entrés en formation à partir de septembre 2026 : 55 semaines de formation pratique (1 925 heures) sur trois ans. Une première période de 9 à 13 semaines pendant la première année, sur deux à trois sites ; puis 42 à 46 semaines sur deux ou trois sites."
  referent: "La première période est encadrée par un référent qui a au moins un diplôme de même niveau. Ensuite, au moins les deux tiers des stages doivent être encadrés par un référent titulaire du diplôme d'État d'assistant de service social : vérifiez qu'il y a un ou une ASS dans le service."
  ancien: "Entrés avant septembre 2026 : 1 820 heures de formation pratique (52 semaines) sur trois ans."
  source_nouveau: ["Arrêté du 6 octobre 2025 relatif au DEASS (Légifrance)", "https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000052384266"]
  source_ancien: ["Fiche DEASS, DREETS Auvergne-Rhône-Alpes (2024)", "https://auvergne-rhone-alpes.dreets.gouv.fr/sites/auvergne-rhone-alpes.dreets.gouv.fr/IMG/pdf/ass_2024.pdf"]
  types: [AEMO / AED, CHRS, "Accueil, veille sociale", CADA, CPH (réfugiés), Mandataire judiciaire (MJPM), Aide à la gestion du budget familial, MDPH, SAVS, SAMSAH, CSAPA (addictologie), Appartements de coordination thérapeutique, "Milieu ouvert (PJJ)", Investigation éducative, Centre social]
  conseils:
  - "Hors annuaire, ne les oubliez pas : services sociaux du conseil départemental, CCAS, hôpitaux, CAF, caisses de retraite et d'assurance maladie, services sociaux en faveur des élèves, services sociaux du travail. Contactez-les directement ou via votre établissement de formation."
  - "Les places dans le service social départemental sont souvent réparties par l'établissement de formation : renseignez-vous tôt sur la procédure."
  - "Un stage en association (CHRS, CADA, protection des majeurs) complète bien un stage en service public."
- slug: educateur-de-jeunes-enfants
  sigle: DEEJE
  titre: éducateur de jeunes enfants
  de: "d'éducateur de jeunes enfants"
  intro: "L'éducateur de jeunes enfants accompagne les enfants de 0 à 7 ans et leurs parents. Les crèches ne sont pas dans notre annuaire (elles figurent sur monenfant.fr), mais beaucoup d'autres lieux accueillent des stagiaires EJE."
  nouveau: "Pour les étudiants entrés en formation à partir de septembre 2026 : 55 semaines de formation pratique (1 925 heures) sur trois ans. Une première période de 9 à 13 semaines pendant la première année, sur deux à trois sites ; puis 42 à 46 semaines sur deux ou trois sites."
  referent: "La première période est encadrée par un référent qui a au moins un diplôme de même niveau. Ensuite, au moins les deux tiers des stages doivent être encadrés par un référent titulaire du diplôme d'État d'éducateur de jeunes enfants."
  ancien: "Entrés avant septembre 2026 : 2 100 heures de stage (60 semaines) sur trois ans."
  source_nouveau: ["Arrêté du 6 octobre 2025 relatif au DEEJE (Légifrance)", "https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000052384514"]
  source_ancien: ["Fiche DEEJE, DREETS Auvergne-Rhône-Alpes (2024)", "https://auvergne-rhone-alpes.dreets.gouv.fr/sites/auvergne-rhone-alpes.dreets.gouv.fr/IMG/pdf/eje_2024.pdf"]
  types: [CAMSP, Centre parental, "Foyer de l'enfance", MECS, IME, SESSAD, Établissement polyhandicap, CMPP, Placement familial, Centre social]
  conseils:
  - "Pour les crèches, multi-accueils et relais petite enfance, cherchez sur monenfant.fr (site de la CAF), qui les recense commune par commune."
  - "Sortir de la crèche est un vrai plus : centre parental, CAMSP, pouponnière ou foyer de l'enfance montrent une autre facette du métier."
  - "Les places en CAMSP sont rares : appelez très tôt."
- slug: educateur-technique-specialise
  sigle: DEETS
  titre: éducateur technique spécialisé
  de: "d'éducateur technique spécialisé"
  intro: "L'éducateur technique spécialisé utilise un métier technique (cuisine, menuiserie, espaces verts…) comme support d'accompagnement et d'insertion professionnelle."
  nouveau: "Pour les étudiants entrés en formation à partir de septembre 2026 : 55 semaines de formation pratique (1 925 heures) sur trois ans. Une première période de 9 à 13 semaines pendant la première année, sur deux à trois sites ; puis 42 à 46 semaines sur deux ou trois sites."
  referent: "La première période est encadrée par un référent qui a au moins un diplôme de même niveau. Ensuite, au moins les deux tiers des stages doivent être encadrés par un référent titulaire du diplôme d'État d'éducateur technique spécialisé : ils sont moins nombreux, vérifiez-le dès l'appel."
  ancien: "Entrés avant septembre 2026 : renseignez-vous auprès de votre établissement de formation, qui applique les règles en vigueur lors de votre entrée."
  source_nouveau: ["Arrêté du 6 octobre 2025 relatif au DEETS (Légifrance)", "https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000052384774"]
  source_ancien: []
  types: [ESAT, IME, ITEP / DITEP, "Activités de jour (PJJ)", Réadaptation professionnelle, Préorientation, Institut d'éducation motrice]
  conseils:
  - "Les Esat et les sections professionnelles des IME (SIPFP) sont les terrains les plus classiques : regardez quels ateliers ils proposent avant d'appeler."
  - "Mettez votre métier technique en avant dans la lettre : c'est ce qui vous distingue."
  - "Les chantiers et entreprises d'insertion ne sont pas dans notre annuaire : renseignez-vous auprès des réseaux de l'insertion par l'activité économique de votre département."
- slug: conseiller-en-economie-sociale-familiale
  sigle: DECESF
  titre: conseiller en économie sociale familiale
  de: "de conseiller en économie sociale familiale"
  intro: "Le conseiller en économie sociale familiale accompagne les personnes dans leur vie quotidienne : budget, logement, alimentation, accès aux droits. La formation dure un an après le BTS ESF (ou un autre diplôme d'État)."
  nouveau: "16 semaines de formation pratique (560 heures) sur l'année de formation. Les nouvelles règles du diplôme entrent en vigueur en septembre 2027 avec la même durée de stage ; la répartition peut varier selon votre profil d'entrée."
  referent: "À partir de septembre 2027, la formation pratique se fait sur un ou deux sites, encadrée par un référent titulaire du diplôme d'État de CESF : vérifiez dès l'appel qu'il y a un ou une CESF dans le service. D'ici là, renseignez-vous auprès de votre établissement sur le nombre de stages et le profil du référent attendu."
  ancien: ""
  source_nouveau: ["Arrêté du 6 octobre 2025 relatif au DECESF (Légifrance)", "https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000052384399"]
  source_ancien: ["Fiche DECESF, DREETS Auvergne-Rhône-Alpes (2024)", "https://auvergne-rhone-alpes.dreets.gouv.fr/sites/auvergne-rhone-alpes.dreets.gouv.fr/IMG/pdf/cesf_2024.pdf"]
  types: [Aide à la gestion du budget familial, Aide à domicile aux familles (TISF), CHRS, Pension de famille, Foyer de jeunes travailleurs, SAVS, Mandataire judiciaire (MJPM), CADA, CPH (réfugiés), "Accueil, veille sociale", Centre social]
  conseils:
  - "Hors annuaire : CCAS, bailleurs sociaux, centres sociaux, CAF et services sociaux départementaux accueillent aussi des CESF."
  - "Le budget, le logement et l'accès aux droits sont vos points forts : choisissez un terrain où vous les mettrez en pratique."
  - "Un an, c'est court : commencez vos recherches dès la rentrée, voire avant."
- slug: accompagnant-educatif-et-social
  sigle: DEAES
  titre: accompagnant éducatif et social
  de: "d'accompagnant éducatif et social"
  intro: "L'accompagnant éducatif et social (AES) aide au quotidien des personnes en situation de handicap, âgées ou en perte d'autonomie, en établissement ou à domicile : gestes de la vie quotidienne, activités, lien social. La formation dure de 10 à 24 mois et les stages en sont le cœur."
  nouveau: "Parcours complet : 840 heures de formation pratique (24 semaines), réparties sur au moins deux stages qui couvrent les cinq blocs de compétences. En parcours partiel, la durée dépend du nombre de blocs à valider (168 heures par bloc), avec au moins un stage."
  referent: "Un référent professionnel est désigné pour chaque stage : il vous encadre et remplit votre évaluation. Si vous travaillez déjà comme accompagnant, vous faites au moins 140 heures de formation pratique sur un site qualifiant."
  ancien: ""
  source_nouveau: ["Arrêté du 30 août 2021 relatif au DEAES (Légifrance)", "https://www.legifrance.gouv.fr/loda/id/JORFTEXT000043990824"]
  source_ancien: []
  types: [MAS, FAM, Accueil médicalisé, Foyer de vie, Foyer non médicalisé, "Foyer d'hébergement", Établissement polyhandicap, IME, SAMSAH, SAVS, Accueil familial spécialisé, Lits halte soins santé]
  conseils:
  - "Variez les publics entre vos stages, par exemple des adultes en situation de handicap puis des enfants, ou un établissement puis un service à domicile : c'est ce qui vous permettra de couvrir les cinq blocs de compétences."
  - "Les EHPAD et les services d'aide et de soins à domicile accueillent aussi beaucoup d'AES, mais ils ne figurent pas dans notre annuaire : cherchez-les à part, auprès de votre établissement de formation ou dans les annuaires du département."
  - "À l'appel, demandez si la structure emploie déjà des AES : un référent du même métier vous aidera à comprendre le poste et à préparer vos évaluations."
